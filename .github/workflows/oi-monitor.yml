name: OI Monitor Screenshot

on:
  schedule:
    - cron: "7,37 * * * *"   # ทุก 30 นาที (เวลา UTC) เลี่ยงนาทีที่ 0/30 ที่ GitHub คิวแน่นและมักข้ามรอบ
  workflow_dispatch:          # กดรันเองจากแท็บ Actions ได้

# ถ้ารอบก่อนยังไม่เสร็จ ไม่ต้องรันซ้อน
concurrency:
  group: oi-monitor
  cancel-in-progress: false

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Screenshot and send to Telegram
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python screenshot_to_telegram.py

      # เก็บภาพไว้ในหน้า Actions ด้วย เปิดดูได้แม้ Telegram ไม่ได้รับ
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshot
          path: screenshot.png
          retention-days: 3
          if-no-files-found: ignore
